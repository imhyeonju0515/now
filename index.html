<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 번호 알림</title>
  <style>
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    figure { margin: 0; text-align: center; }
    .num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #ff9f1c;
      background: #fff;
      color: #e8590c;
      font-weight: bold;
      cursor: pointer;
    }
    .num:hover { background: #ff9f1c; color: #fff; }
  </style>
</head>
<body>
  <div class="row">
    <figure>
      <img src="screenshot.png" alt="이미지 1" width="60">
      <figcaption><button type="button" class="num" onclick="alert('1')">1</button></figcaption>
    </figure>
